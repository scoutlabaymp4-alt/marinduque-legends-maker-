<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Marinduque Folklore Character Maker</title>
    <style>
      body { max-width: 680px; margin: 3rem auto; padding: 0 1rem; color: #263b31; font-family: Arial, sans-serif; }
      label { display: block; margin: 1rem 0 .35rem; }
      input, select, button { width: 100%; padding: .7rem; font: inherit; }
      button { margin-top: 1rem; color: white; border: 0; background: #38634d; cursor: pointer; }
      #result { margin-top: 1.5rem; padding: 1rem; background: #f0eee4; }
    </style>
  </head>
  <body>
    <main>
      <h1>Marinduque Folklore Character Maker</h1>
      <p>Create a character inspired by Marinduque folklore.</p>
      <form id="maker">
        <label for="name">Character name</label>
        <input id="name" required>
        <label for="legend">Choose a legend</label>
        <select id="legend">
          <option>Island Explorer</option>
          <option>Festival Guardian</option>
          <option>Story Keeper</option>
        </select>
        <button type="submit">Make my character</button>
      </form>
      <section id="result" aria-live="polite">Your character will appear here.</section>
    </main>
    <script>
      document.querySelector("#maker").addEventListener("submit", (event) => {
        event.preventDefault();
        const name = document.querySelector("#name").value.trim();
        const legend = document.querySelector("#legend").value;
        document.querySelector("#result").textContent = `${name} — ${legend}`;
      });
    </script>
  </body>
</html>
